<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio</title>
  <meta name="description" content="Portfolio and résumé" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='50' fill='%236d5dfc'/><path d='M30 62l20-34 20 34z' fill='white'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    (function () {
      var t = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <div class="layout">
    <!-- Left sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Site navigation"></aside>
    <div class="scrim" id="scrim"></div>

    <div class="main-col">
      <!-- Top bar -->
      <header class="topbar">
        <button class="icon-btn only-mobile" id="menuBtn" aria-label="Open menu">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
        <div class="search">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="searchInput" type="search" placeholder="Search…" aria-label="Search posts" autocomplete="off" />
        </div>
      </header>

      <div class="content-wrap">
        <main class="content" id="view" tabindex="-1"></main>
        <aside class="panel" id="panel" aria-label="Side panel"></aside>
      </div>

      <footer class="footer" id="footer"></footer>
    </div>
  </div>

  <button class="to-top" id="toTop" aria-label="Back to top">↑</button>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
